<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learn Blimp</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #1a1a2e;
  color: #d4d4d4;
  font-family: 'IBM Plex Mono', 'Fira Code', 'JetBrains Mono', 'Cascadia Code', 'SF Mono', Consolas, monospace;
  font-size: 14px;
  height: 100vh;
  display: flex;
  flex-direction: column;
  -webkit-text-size-adjust: 100%;
}

.header {
  padding: 0.75rem 1.5rem;
  border-bottom: 1px solid #2a2a3e;
  display: flex;
  align-items: center;
  gap: 1rem;
  flex-shrink: 0;
}

.header h1 { font-size: 1rem; font-weight: 500; color: #a855f7; }
.header .status { font-size: 0.8rem; color: #666; }
.header .lesson-info { font-size: 0.75rem; color: #666; margin-left: auto; }

.main {
  display: flex;
  flex: 1;
  overflow: hidden;
}

.left-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.repl-pane {
  flex: 1;
  overflow-y: auto;
  padding: 1rem 1.5rem;
  font-size: 13px;
  line-height: 1.6;
  min-height: 0;
}

.view-pane {
  height: 40%;
  border-top: 1px solid #2a2a3e;
  flex-shrink: 0;
  overflow-y: auto;
  padding: 1rem 1.5rem;
}

.view-pane:empty { display: none; }

/* View DSL rendering */
.blimp-stack { display: flex; flex-direction: column; gap: 0.5rem; }
.blimp-row { display: flex; flex-direction: row; gap: 0.5rem; align-items: center; }
.blimp-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 0.5rem; }
.blimp-text { color: #d4d4d4; }
.blimp-bold { font-weight: bold; }
.blimp-italic { font-style: italic; }
.blimp-code { font-family: inherit; background: #2a2a3e; padding: 0.1em 0.4em; border-radius: 3px; color: #a6e22e; }
.blimp-code-block { background: #2a2a3e; padding: 0.75rem 1rem; border-radius: 4px; color: #a6e22e; white-space: pre-wrap; font-family: inherit; overflow-x: auto; }
.blimp-blockquote { border-left: 3px solid #a6e22e; padding-left: 1rem; color: #999; font-style: italic; }
.blimp-divider { border: none; border-top: 1px solid #2a2a3e; margin: 0.5rem 0; }
.blimp-list { list-style: disc; padding-left: 1.5rem; color: #d4d4d4; }
.blimp-list li { margin-bottom: 0.25rem; }
.blimp-link { color: #6cb6ff; text-decoration: underline; cursor: pointer; }
.blimp-button { background: #2a2a3e; color: #a6e22e; border: 1px solid #3a3a5e; padding: 0.4rem 1rem; border-radius: 4px; cursor: pointer; font: inherit; font-size: 13px; }
.blimp-button:hover { background: #3a3a5e; }

.repl-pane .line { white-space: pre-wrap; word-break: break-all; }
.prompt-line { color: #a6e22e; }
.result-line { color: #d4d4d4; }
.error-line { color: #f92672; }
.print-line { color: #6cb6ff; }
.spacer-line { height: 0.4em; }

/* Tutorial-specific lines */
.lesson-line { color: #a855f7; font-weight: 600; margin-top: 0.5rem; }
.lesson-desc { color: #999; }
.lesson-code { color: #a6e22e; background: #2a2a3e; padding: 0.4rem 0.8rem; border-radius: 4px; display: inline-block; margin: 0.3rem 0; }
.lesson-pass { color: #4ade80; font-weight: 600; }
.lesson-fail { color: #f87171; }
.lesson-hint { color: #facc15; font-size: 12px; }

.input-row {
  display: flex;
  align-items: flex-start;
  gap: 0;
  margin-top: 0.15rem;
}

.input-row .prompt-char {
  color: #a6e22e;
  user-select: none;
  white-space: pre;
}

.input-row textarea {
  flex: 1;
  background: transparent;
  border: none;
  color: #d4d4d4;
  font: inherit;
  font-size: 13px;
  line-height: 1.6;
  resize: none;
  outline: none;
  min-height: 1.6em;
  max-height: 20em;
  padding: 0;
  margin: 0;
}

.state-pane {
  width: 280px;
  border-left: 1px solid #2a2a3e;
  padding: 1rem;
  overflow-y: auto;
  flex-shrink: 0;
}

.state-pane h2 {
  font-size: 0.8rem;
  color: #666;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 0.75rem;
}

.state-pane .var { margin-bottom: 0.3rem; font-size: 12px; }
.state-pane .var-name { color: #a6e22e; }
.state-pane .var-eq { color: #666; }
.state-pane .var-val { color: #d4d4d4; }

@media (max-width: 700px) {
  .state-pane { display: none; }
  .repl-pane { padding: 0.75rem 1rem; }
  .input-row textarea { font-size: 16px; } /* prevent iOS zoom */
}
</style>
</head>
<body>

<div class="header">
  <h1>learn blimp</h1>
  <span class="status" id="status">loading...</span>
  <span class="lesson-info" id="lesson-info"></span>
</div>

<div class="main">
  <div class="left-col">
    <div class="repl-pane" id="repl"></div>
    <div class="view-pane" id="view-pane"></div>
  </div>
  <div class="state-pane">
    <h2>State</h2>
    <div id="state-content"></div>
  </div>
</div>

<script src="blimp.js"></script>
<script>
(async function() {
  var repl = document.getElementById('repl');
  var statusEl = document.getElementById('status');
  var lessonInfoEl = document.getElementById('lesson-info');
  var stateContent = document.getElementById('state-content');
  var viewPane = document.getElementById('view-pane');

  var blimp = new Blimp();
  var history = [];
  var historyIdx = -1;
  var buffer = '';
  var depth = 0;
  var inputRow = null;
  var inputEl = null;
  var mountedActors = {};
  var currentLesson = 0;

  // Restore progress
  try { currentLesson = parseInt(localStorage.getItem('blimp_lesson') || '0') || 0; } catch(e) {}

  // ── Lessons ────────────────────────────────────────────

  var lessons = [
    { title: "Values", desc: "Blimp has integers and arithmetic. Try it:", prompt: "Type: 2 + 3", check: function(v) { return v === '5' ? true : 'Try typing: 2 + 3'; } },
    { title: "Strings", desc: "Strings use double quotes. concat joins them.", prompt: 'Type: concat("hello", " world")', check: function(v) { return unquote(v) === 'hello world' ? true : 'Try: concat("hello", " world")'; } },
    { title: "Atoms", desc: "Atoms start with : and represent themselves.", prompt: "Type: :ok", check: function(v) { return v === ':ok' ? true : 'Try typing: :ok'; } },
    { title: "Booleans", desc: "Comparisons return true or false.", prompt: "What is 10 > 3?", check: function(v) { return v === 'true' ? true : 'Try: 10 > 3'; } },
    { title: "Variables", desc: "Assign with =. The REPL shows the value.", prompt: "Set x to 42:", check: function(v, s) { return hasVar(s, 'x', '42') ? true : 'Type: x = 42'; } },
    { title: "Lists", desc: "Lists hold ordered values in square brackets.", prompt: "Type: length([10, 20, 30])", check: function(v) { return v === '3' ? true : 'Try: length([10, 20, 30])'; } },
    { title: "Functions", desc: "def defines a function. Parameters need types.", prompt: "Define: def double(n: Int) do n * 2 end", check: function(v, s) { return hasVar(s, 'double') ? true : 'Type the full def...end block'; }, then: "Now try: double(21)" },
    { title: "Try your function", desc: "Call the function you just defined.", prompt: "Type: double(21)", check: function(v) { return v === '42' ? true : 'Expected 42. Try: double(21)'; } },
    { title: "Your first view", desc: "Blimp has built-in view primitives that render as UI.", prompt: 'Type: text("Hello, Blimp!")', check: function(v, s, r) { return r && r.view ? true : 'Try: text("Hello, Blimp!")'; } },
    { title: "Stacking views", desc: "stack() arranges views vertically. Try building a layout.", prompt: 'Try: stack(heading("Hi"), text("Welcome to Blimp"))', check: function(v, s, r) { return r && r.view ? true : 'Use stack(heading(...), text(...))'; } },
    { title: "Buttons", desc: "button() creates a clickable button. row() lays them out horizontally.", prompt: 'Try: row(button("Yes"), button("No"))', check: function(v, s, r) { return r && r.view ? true : 'Try: row(button("Yes"), button("No"))'; } },
    { title: "Actors", desc: "Actors hold state and respond to messages. Define one:", prompt: "Paste or type a Counter actor with state count: Int :: 0", multiline: true, check: function(v, s) { return hasActor(s, 'Counter') ? true : 'Define: actor Counter do\\n  state count: Int :: 0\\nend'; } },
    { title: "Send a message", desc: "Send messages with <-. The actor replies.", prompt: "Try: Counter <- :get_count", check: function(v, s) { return v === '0' || hasActor(s, 'Counter') ? true : 'Make sure Counter has an on :get_count handler'; }, setup: "If you haven't defined Counter, paste:\\nactor Counter do\\n  state count: Int :: 0\\n  on :increment do become count: count + 1 end\\n  on :get_count do reply count end\\nend" },
    { title: "Mutate state", desc: "become updates an actor's state. Try incrementing.", prompt: "Type: Counter <- :increment then Counter <- :get_count", check: function(v) { return v !== '0' && v !== undefined ? true : 'Send :increment first, then :get_count'; } },
    { title: "map", desc: "map transforms every element in a list.", prompt: "Type: map([1,2,3], fn(x: Int) do x * 10 end)", check: function(v) { return v === '[10, 20, 30]' ? true : 'Try: map([1,2,3], fn(x: Int) do x * 10 end)'; } },
    { title: "filter", desc: "filter keeps elements that pass a test.", prompt: "Type: filter([1,2,3,4,5], fn(x: Int) do x > 3 end)", check: function(v) { return v === '[4, 5]' ? true : 'Try: filter([1,2,3,4,5], fn(x: Int) do x > 3 end)'; } },
    { title: "Actor views", desc: "Actors can render views. Try making a card.", prompt: 'Type: stack(heading("Card"), text("Built in Blimp"), divider(), row(button("OK"), button("Cancel")))', check: function(v, s, r) { return r && r.view ? true : 'Build a view with stack, heading, text, buttons'; } },
    { title: "Free play", desc: "You've learned the basics. The REPL is yours -- experiment!", prompt: "Try anything. Type /lessons to restart.", freeplay: true }
  ];

  // ── Helpers ────────────────────────────────────────────

  function hasVar(state, name, val) {
    if (!state || !state.vars) return false;
    for (var v of state.vars) { if (v.name === name && (!val || v.value === val)) return true; }
    return false;
  }
  function hasActor(state, type) {
    if (!state || !state.actors) return false;
    for (var a of state.actors) { if (a.type === type) return true; }
    return false;
  }
  function unquote(s) {
    if (s && s.length >= 2 && s[0] === '"' && s[s.length-1] === '"') return s.slice(1,-1);
    return s;
  }

  // ── WASM init ──────────────────────────────────────────

  blimp.onPrint(function(str) { addLine('print-line', str); });

  try {
    await blimp.init('blimp.wasm');
    statusEl.textContent = 'ready';
    statusEl.style.color = '#a6e22e';
  } catch (e) {
    statusEl.textContent = 'failed';
    statusEl.style.color = '#f92672';
    addLine('error-line', 'Failed to load: ' + e.message);
    return;
  }

  showLesson();
  createPrompt();

  repl.addEventListener('click', function() { if (inputEl) inputEl.focus(); });

  // ── Show current lesson ────────────────────────────────

  function showLesson() {
    var lesson = lessons[currentLesson];
    if (!lesson) return;
    lessonInfoEl.textContent = (currentLesson + 1) + ' / ' + lessons.length;
    addLine('spacer-line', '');
    addLine('lesson-line', '── ' + lesson.title + ' ──');
    addLine('lesson-desc', lesson.desc);
    if (lesson.setup) addLine('lesson-hint', lesson.setup);
    addLine('lesson-desc', lesson.prompt);
    addLine('spacer-line', '');
  }

  // ── View renderer (same as REPL) ───────────────────────

  function renderView(node) {
    if (!node) return document.createTextNode('');
    if (node.text !== undefined) return document.createTextNode(node.text);
    var tag = node.tag, attrs = node.attrs || {}, children = node.children || [], el;
    switch (tag) {
      case 'stack': el = document.createElement('div'); el.className = 'blimp-stack'; break;
      case 'row': el = document.createElement('div'); el.className = 'blimp-row'; break;
      case 'grid': el = document.createElement('div'); el.className = 'blimp-grid'; break;
      case 'text': el = document.createElement('span'); el.className = 'blimp-text'; break;
      case 'heading':
        var lvl = Math.max(1, Math.min(6, attrs.level || 1));
        el = document.createElement('h' + lvl); break;
      case 'bold': el = document.createElement('strong'); el.className = 'blimp-bold'; break;
      case 'italic': el = document.createElement('em'); el.className = 'blimp-italic'; break;
      case 'code': el = document.createElement('code'); el.className = 'blimp-code'; break;
      case 'code_block': el = document.createElement('pre'); el.className = 'blimp-code-block'; break;
      case 'blockquote': el = document.createElement('blockquote'); el.className = 'blimp-blockquote'; break;
      case 'divider': el = document.createElement('hr'); el.className = 'blimp-divider'; return el;
      case 'list':
        el = document.createElement('ul'); el.className = 'blimp-list';
        for (var i = 0; i < children.length; i++) { var li = document.createElement('li'); li.appendChild(renderView(children[i])); el.appendChild(li); }
        return el;
      case 'link': el = document.createElement('a'); el.className = 'blimp-link'; if (attrs.href) el.href = attrs.href; break;
      case 'image': el = document.createElement('img'); el.className = 'blimp-image'; if (attrs.src) el.src = attrs.src; return el;
      case 'button':
        el = document.createElement('button'); el.className = 'blimp-button';
        if (attrs.sends) { (function(msg) { el.addEventListener('click', function() { sendToActor(msg); }); })(attrs.sends); }
        break;
      default: el = document.createElement('div'); break;
    }
    for (var i = 0; i < children.length; i++) el.appendChild(renderView(children[i]));
    return el;
  }

  function sendToActor(message) {
    var refs = Object.keys(mountedActors);
    if (refs.length === 0) return;
    var actorRef = refs[0];
    var state = blimp.getState();
    var varName = null;
    if (state.vars) { for (var v of state.vars) { if (v.value === actorRef) { varName = v.name; break; } } }
    if (varName) {
      blimp.eval(varName + ' <- :' + message);
      var viewResult = blimp.eval(varName + ' <- :view');
      if (viewResult.ok && viewResult.view) { mountedActors[actorRef] = { view: viewResult.view }; renderMountedViews(); }
      updateState(blimp.getState());
    }
  }

  function renderMountedViews() {
    viewPane.innerHTML = '';
    for (var ref in mountedActors) { if (mountedActors[ref].view) viewPane.appendChild(renderView(mountedActors[ref].view)); }
  }

  // ── REPL ───────────────────────────────────────────────

  function createPrompt() {
    inputRow = document.createElement('div');
    inputRow.className = 'input-row';
    var prompt = document.createElement('span');
    prompt.className = 'prompt-char';
    prompt.textContent = depth > 0 ? '   ... ' : 'blimp> ';
    inputEl = document.createElement('textarea');
    inputEl.rows = 1;
    inputEl.spellcheck = false;
    inputEl.autocomplete = 'off';
    inputEl.addEventListener('keydown', handleKey);
    inputEl.addEventListener('input', autoResize);
    inputRow.appendChild(prompt);
    inputRow.appendChild(inputEl);
    repl.appendChild(inputRow);
    inputEl.focus();
    repl.scrollTop = repl.scrollHeight;
  }

  function freezeInput() {
    if (!inputRow || !inputEl) return;
    var text = inputEl.value;
    var prompt = depth > 0 ? '   ... ' : 'blimp> ';
    inputRow.remove();
    addLine('prompt-line', prompt + text);
    inputRow = null; inputEl = null;
    return text;
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      var line = freezeInput();
      buffer += (buffer ? '\n' : '') + line;
      depth += countDepth(line);
      if (depth > 0) { createPrompt(); return; }
      submitBuffer();
      createPrompt();
      return;
    }
    if (e.key === 'ArrowUp' && !buffer && inputEl.selectionStart === 0) {
      e.preventDefault();
      if (historyIdx > 0) { historyIdx--; inputEl.value = history[historyIdx]; autoResize.call(inputEl); }
    }
    if (e.key === 'ArrowDown' && !buffer && inputEl.selectionStart === inputEl.value.length) {
      e.preventDefault();
      if (historyIdx < history.length - 1) { historyIdx++; inputEl.value = history[historyIdx]; }
      else { historyIdx = history.length; inputEl.value = ''; }
      autoResize.call(inputEl);
    }
  }

  function autoResize() { this.style.height = 'auto'; this.style.height = Math.min(this.scrollHeight, 320) + 'px'; }

  function countDepth(text) {
    var d = 0, words = text.replace(/#.*/g, '').match(/\b(do|end)\b/g) || [];
    for (var w of words) { if (w === 'do') d++; else if (w === 'end') d--; }
    return d;
  }

  function submitBuffer() {
    var source = buffer.trim();
    if (!source) { buffer = ''; depth = 0; return; }

    // Meta commands
    if (source === '/lessons') { currentLesson = 0; blimp.reset(); saveProgress(); addLine('lesson-line', 'Restarting lessons...'); showLesson(); buffer = ''; depth = 0; return; }
    if (source === '/skip') { advanceLesson(); buffer = ''; depth = 0; return; }

    history.push(source);
    historyIdx = history.length;

    var result = blimp.eval(source);
    if (result.ok) {
      if (result.view) {
        addLine('result-line', '=> <view>');
        var state = blimp.getState();
        if (state.actors && state.actors.length) { mountedActors[state.actors[state.actors.length-1].ref] = { view: result.view }; }
        else { mountedActors['__repl__'] = { view: result.view }; }
        renderMountedViews();
      } else if (result.value) {
        addLine('result-line', '=> ' + result.value);
      }
    } else {
      addLine('error-line', result.error);
    }

    addLine('spacer-line', '');
    var state = blimp.getState();
    updateState(state);

    // Check lesson
    var lesson = lessons[currentLesson];
    if (lesson && !lesson.freeplay && lesson.check) {
      var passed = lesson.check(result.ok ? result.value : null, state, result);
      if (passed === true) {
        addLine('lesson-pass', 'Correct!');
        if (lesson.then) { addLine('lesson-hint', lesson.then); }
        else { advanceLesson(); }
      }
      // Don't show fail on every line -- only hint if they seem stuck
    }

    buffer = '';
    depth = 0;
  }

  function advanceLesson() {
    currentLesson++;
    saveProgress();
    if (currentLesson < lessons.length) {
      showLesson();
    } else {
      addLine('lesson-pass', 'You completed all lessons! The REPL is yours.');
      lessonInfoEl.textContent = 'done';
    }
  }

  function saveProgress() { try { localStorage.setItem('blimp_lesson', currentLesson.toString()); } catch(e) {} }

  function updateState(state) {
    stateContent.innerHTML = '';
    if (state.vars && state.vars.length) {
      for (var v of state.vars) {
        var div = document.createElement('div'); div.className = 'var';
        div.innerHTML = '<span class="var-name">' + esc(v.name) + '</span> <span class="var-eq">=</span> <span class="var-val">' + esc(v.value) + '</span>';
        stateContent.appendChild(div);
      }
    }
    if (state.actors && state.actors.length) {
      var h = document.createElement('h2'); h.textContent = 'Actors'; h.style.marginTop = '1rem'; stateContent.appendChild(h);
      for (var a of state.actors) {
        var rd = document.createElement('div'); rd.className = 'var';
        rd.innerHTML = '<span class="var-name">' + esc(a.type) + '</span>';
        stateContent.appendChild(rd);
        for (var key in a.state) {
          var fd = document.createElement('div'); fd.className = 'var'; fd.style.paddingLeft = '1rem';
          fd.innerHTML = '<span class="var-eq">' + esc(key) + ':</span> <span class="var-val">' + esc(a.state[key]) + '</span>';
          stateContent.appendChild(fd);
        }
      }
    }
  }

  function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  function addLine(cls, text) {
    var div = document.createElement('div');
    div.className = 'line ' + cls;
    if (cls === 'spacer-line') { div.innerHTML = '&nbsp;'; }
    else { div.textContent = text; }
    repl.appendChild(div);
    repl.scrollTop = repl.scrollHeight;
  }
})();
</script>
</body>
</html>
