<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learn Blimp</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Berkeley Mono', 'SF Mono', Menlo, monospace;
  background: #18181b; color: #e4e4e7; line-height: 1.6;
  -webkit-text-size-adjust: 100%;
}
.page { max-width: 720px; margin: 0 auto; padding: 16px; padding-top: 24px; padding-bottom: 64px; }
.header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
h1 { color: #a855f7; font-size: 22px; }
h2 { color: #e4e4e7; font-size: 18px; margin-top: 8px; }
.lesson-num { color: #71717a; font-size: 14px; }
.description { color: #a1a1aa; margin: 12px 0; }
pre {
  background: #27272a; color: #e4e4e7; padding: 14px; border-radius: 8px;
  font-family: inherit; font-size: 14px; overflow-x: auto;
  border: 1px solid #3f3f46; white-space: pre-wrap; word-break: break-word;
  margin: 12px 0;
}
code { font-family: inherit; background: #27272a; padding: 2px 6px; border-radius: 4px; }
hr { border: none; border-top: 1px solid #3f3f46; margin: 20px 0; }
input[type=text] {
  padding: 12px 14px; background: #27272a; border: 1px solid #3f3f46; border-radius: 8px;
  color: #e4e4e7; font-size: 16px; font-family: inherit; width: 100%;
  min-height: 44px; -webkit-appearance: none;
}
textarea {
  padding: 12px 14px; background: #27272a; border: 1px solid #3f3f46; border-radius: 8px;
  color: #e4e4e7; font-size: 16px; font-family: inherit; width: 100%;
  min-height: 140px; resize: vertical; tab-size: 2; -webkit-appearance: none;
}
input:focus, textarea:focus { outline: none; border-color: #a855f7; box-shadow: 0 0 0 2px rgba(168,85,247,0.3); }
.btn {
  padding: 12px 24px; background: #a855f7; color: white; border: none;
  border-radius: 8px; cursor: pointer; font-size: 16px; font-family: inherit;
  font-weight: 600; min-height: 44px; -webkit-appearance: none; touch-action: manipulation;
}
.btn:hover { background: #9333ea; }
.btn:active { background: #7e22ce; transform: scale(0.98); }
.btn-outline {
  padding: 12px 24px; background: transparent; color: #a1a1aa; border: 1px solid #3f3f46;
  border-radius: 8px; cursor: pointer; font-size: 16px; font-family: inherit;
  font-weight: 600; min-height: 44px; -webkit-appearance: none; touch-action: manipulation;
}
.btn-outline:hover { border-color: #a855f7; color: #e4e4e7; }
.btn-row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
.feedback { margin: 12px 0; padding: 12px 16px; border-radius: 8px; font-weight: 600; }
.feedback.pass { background: rgba(74,222,128,0.1); color: #4ade80; border: 1px solid rgba(74,222,128,0.2); }
.feedback.fail { background: rgba(248,113,113,0.1); color: #f87171; border: 1px solid rgba(248,113,113,0.2); }
.hidden { display: none; }
.loading { text-align: center; padding: 48px; color: #71717a; }
.progress-bar { height: 4px; background: #27272a; border-radius: 2px; margin: 16px 0; overflow: hidden; }
.progress-fill { height: 100%; background: #a855f7; border-radius: 2px; transition: width 0.3s; }
@media (max-width: 480px) {
  .page { padding: 12px; padding-top: 16px; }
  h1 { font-size: 20px; }
  h2 { font-size: 16px; }
  pre { font-size: 13px; padding: 12px; }
  .btn, .btn-outline { width: 100%; }
  .btn-row { flex-direction: column; }
}
</style>
</head>
<body>

<div class="page">
  <div id="loading" class="loading">Loading Blimp WASM module...</div>
  <div id="app" class="hidden"></div>
</div>

<script src="blimp.js"></script>
<script>
(function() {
  var lessons = [
    {
      title: "Values: Integers",
      description: "Blimp has integers. Type the value that this expression evaluates to:",
      showCode: "2 + 3",
      type: "predict",
      expected: "5"
    },
    {
      title: "Values: Strings",
      description: "Strings use double quotes and concat joins them. What does this evaluate to?",
      showCode: 'concat("hello", " world")',
      type: "predict",
      expected: "hello world"
    },
    {
      title: "Values: Atoms",
      description: "Atoms are constants that represent themselves. They start with a colon. What is this?",
      showCode: ":ok",
      type: "predict",
      expected: ":ok"
    },
    {
      title: "Values: Booleans",
      description: "true and false. What does this return?",
      showCode: "3 > 2",
      type: "predict",
      expected: "true"
    },
    {
      title: "Values: Lists",
      description: "Lists hold ordered values. What does length return here?",
      showCode: 'length([10, 20, 30])',
      type: "predict",
      expected: "3"
    },
    {
      title: "Variables",
      description: "Variables are assigned with =. Fill in the blank so x equals 42:",
      starter: "x = ___",
      type: "fill",
      validate: function(code, blimp) {
        blimp.reset();
        var r = blimp.eval(code);
        if (!r.ok) return { pass: false, msg: r.error };
        var check = blimp.eval("x");
        if (check.ok && check.value === "42") return { pass: true };
        return { pass: false, msg: "x should equal 42, got: " + (check.ok ? check.value : check.error) };
      }
    },
    {
      title: "Functions: def",
      description: "Functions are defined with def. Write a function called double that takes n and returns n * 2:",
      starter: "def double(n) do\n  \nend",
      type: "write",
      validate: function(code, blimp) {
        blimp.reset();
        var r = blimp.eval(code);
        if (!r.ok) return { pass: false, msg: r.error };
        var t1 = blimp.eval("double(5)");
        if (!t1.ok || t1.value !== "10") return { pass: false, msg: "double(5) should be 10, got: " + (t1.ok ? t1.value : t1.error) };
        var t2 = blimp.eval("double(0)");
        if (!t2.ok || t2.value !== "0") return { pass: false, msg: "double(0) should be 0, got: " + (t2.ok ? t2.value : t2.error) };
        return { pass: true, msg: "2/2 tests passed!" };
      }
    },
    {
      title: "Functions: Multiple Args",
      description: "Write a function called add that takes a and b and returns their sum:",
      starter: "",
      type: "write",
      validate: function(code, blimp) {
        blimp.reset();
        var r = blimp.eval(code);
        if (!r.ok) return { pass: false, msg: r.error };
        var t1 = blimp.eval("add(3, 4)");
        if (!t1.ok || t1.value !== "7") return { pass: false, msg: "add(3, 4) should be 7, got: " + (t1.ok ? t1.value : t1.error) };
        var t2 = blimp.eval("add(-1, 1)");
        if (!t2.ok || t2.value !== "0") return { pass: false, msg: "add(-1, 1) should be 0, got: " + (t2.ok ? t2.value : t2.error) };
        return { pass: true, msg: "2/2 tests passed!" };
      }
    },
    {
      title: "Your First Actor",
      description: "Actors hold state and respond to messages. This Greeter actor is almost done. Fill in the default name so it greets \"World\":",
      starter: 'actor Greeter do\n  state name: String :: ___\n  on :greet do\n    reply concat("Hello, ", name)\n  end\nend',
      type: "write",
      validate: function(code, blimp) {
        blimp.reset();
        var r = blimp.eval(code);
        if (!r.ok) return { pass: false, msg: r.error };
        var t = blimp.eval('Greeter <- :greet');
        if (!t.ok) return { pass: false, msg: t.error };
        if (t.value === 'Hello, World') return { pass: true };
        return { pass: false, msg: 'Greeter <- :greet should return "Hello, World", got: ' + t.value };
      }
    },
    {
      title: "Actor State: become",
      description: "Actors change state with become. Write a Counter actor with count starting at 0, an :increment handler (become count: count + 1), and a :get_count handler (reply count):",
      starter: "actor Counter do\n  \nend",
      type: "write",
      validate: function(code, blimp) {
        blimp.reset();
        var r = blimp.eval(code);
        if (!r.ok) return { pass: false, msg: r.error };
        var t1 = blimp.eval('Counter <- :get_count');
        if (!t1.ok || t1.value !== "0") return { pass: false, msg: "count should start at 0, got: " + (t1.ok ? t1.value : t1.error) };
        blimp.eval('Counter <- :increment');
        var t2 = blimp.eval('Counter <- :get_count');
        if (!t2.ok || t2.value !== "1") return { pass: false, msg: "after increment, count should be 1, got: " + (t2.ok ? t2.value : t2.error) };
        return { pass: true, msg: "2/2 tests passed!" };
      }
    },
    {
      title: "Builtins: map",
      description: "map transforms every element in a list. What does this return?",
      showCode: "map([1, 2, 3], fn(x: Int) do x * 2 end)",
      type: "predict",
      expected: "[2, 4, 6]"
    },
    {
      title: "Builtins: filter",
      description: "filter keeps elements that pass a test. What does this return?",
      showCode: "filter([1, 2, 3, 4, 5], fn(x: Int) do x > 3 end)",
      type: "predict",
      expected: "[4, 5]"
    },
    {
      title: "Pipes",
      description: "The pipe operator |> passes the result of the left side as the first argument to the right. What does this return?",
      showCode: '[1, 2, 3, 4, 5] |> filter(_, fn(x: Int) do x > 2 end) |> length',
      type: "predict",
      expected: "3"
    },
    {
      title: "Putting It Together",
      description: "Write a function called sum_evens that takes a list of integers and returns the sum of only the even numbers. Use filter and reduce:",
      starter: "",
      type: "write",
      validate: function(code, blimp) {
        blimp.reset();
        var r = blimp.eval(code);
        if (!r.ok) return { pass: false, msg: r.error };
        var t1 = blimp.eval("sum_evens([1, 2, 3, 4, 5, 6])");
        if (!t1.ok || t1.value !== "12") return { pass: false, msg: "sum_evens([1,2,3,4,5,6]) should be 12, got: " + (t1.ok ? t1.value : t1.error) };
        var t2 = blimp.eval("sum_evens([1, 3, 5])");
        if (!t2.ok || t2.value !== "0") return { pass: false, msg: "sum_evens([1,3,5]) should be 0, got: " + (t2.ok ? t2.value : t2.error) };
        return { pass: true, msg: "2/2 tests passed!" };
      }
    }
  ];

  var currentLesson = 0;
  var blimpInstance = null;
  var app = document.getElementById('app');
  var loading = document.getElementById('loading');

  // Load WASM
  var blimp = new Blimp();
  blimp.init('blimp.wasm').then(function() {
    blimpInstance = blimp;
    loading.classList.add('hidden');
    app.classList.remove('hidden');
    render();
  }).catch(function(e) {
    loading.textContent = 'Failed to load: ' + e.message;
    loading.style.color = '#f87171';
  });

  function render() {
    var lesson = lessons[currentLesson];
    var progress = ((currentLesson) / lessons.length) * 100;
    var html = '';

    html += '<div class="header">';
    html += '<h1>Learn Blimp</h1>';
    html += '<span class="lesson-num">Lesson ' + (currentLesson + 1) + ' of ' + lessons.length + '</span>';
    html += '</div>';
    html += '<div class="progress-bar"><div class="progress-fill" style="width:' + progress + '%"></div></div>';
    html += '<h2>' + esc(lesson.title) + '</h2>';
    html += '<p class="description">' + esc(lesson.description) + '</p>';

    if (lesson.showCode) {
      html += '<pre>' + esc(lesson.showCode) + '</pre>';
    }

    if (lesson.type === 'predict') {
      html += '<input type="text" id="answer" placeholder="Type your answer..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />';
      html += '<div class="btn-row"><button class="btn" id="check-btn">Check</button></div>';
    } else {
      html += '<textarea id="code" placeholder="Write your code here..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">' + esc(lesson.starter || '') + '</textarea>';
      html += '<div class="btn-row"><button class="btn" id="check-btn">' + (lesson.type === 'write' ? 'Run Tests' : 'Check') + '</button></div>';
    }

    html += '<div id="feedback"></div>';

    html += '<hr>';
    html += '<div class="btn-row">';
    if (currentLesson > 0) {
      html += '<button class="btn-outline" id="prev-btn">Previous</button>';
    }
    html += '<div id="next-container"></div>';
    html += '</div>';

    app.innerHTML = html;

    // Wire events
    var checkBtn = document.getElementById('check-btn');
    checkBtn.addEventListener('click', handleCheck);

    var inputEl = document.getElementById('answer') || document.getElementById('code');
    if (inputEl) {
      inputEl.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey && inputEl.tagName === 'INPUT') {
          e.preventDefault();
          handleCheck();
        }
      });
      inputEl.focus();
    }

    var prevBtn = document.getElementById('prev-btn');
    if (prevBtn) prevBtn.addEventListener('click', function() { currentLesson--; render(); });
  }

  function handleCheck() {
    var lesson = lessons[currentLesson];
    var feedbackEl = document.getElementById('feedback');
    var result;

    if (lesson.type === 'predict') {
      var answer = document.getElementById('answer').value.trim();
      // For predict: eval the showCode, compare result to answer
      blimpInstance.reset();
      var evalResult = blimpInstance.eval(lesson.showCode);
      var expected = lesson.expected;
      if (answer === expected || (evalResult.ok && answer === evalResult.value)) {
        result = { pass: true };
      } else {
        result = { pass: false, msg: 'Expected: ' + expected };
      }
    } else {
      var code = document.getElementById('code').value;
      if (lesson.validate) {
        result = lesson.validate(code, blimpInstance);
      } else {
        result = { pass: false, msg: 'No validator for this lesson' };
      }
    }

    feedbackEl.className = 'feedback ' + (result.pass ? 'pass' : 'fail');
    feedbackEl.textContent = result.pass ? (result.msg || 'Correct!') : (result.msg || 'Not quite.');

    if (result.pass) {
      var container = document.getElementById('next-container');
      if (currentLesson < lessons.length - 1) {
        container.innerHTML = '<button class="btn" id="next-btn">Next Lesson &rarr;</button>';
        document.getElementById('next-btn').addEventListener('click', function() { currentLesson++; render(); });
      } else {
        container.innerHTML = '<span style="color:#4ade80;font-weight:600">You completed all lessons!</span>';
      }
    }
  }

  function esc(s) {
    if (!s) return '';
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
})();
</script>
</body>
</html>
