<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learn Blimp</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Berkeley Mono', 'SF Mono', Menlo, monospace;
  background: #18181b; color: #e4e4e7; line-height: 1.6;
  -webkit-text-size-adjust: 100%;
}
.page { max-width: 720px; margin: 0 auto; padding: 16px; padding-top: 24px; padding-bottom: 64px; }
.header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
h1 { color: #a855f7; font-size: 22px; }
h2 { color: #e4e4e7; font-size: 18px; margin-top: 8px; }
.lesson-num { color: #71717a; font-size: 14px; }
.description { color: #a1a1aa; margin: 12px 0; }
pre {
  background: #27272a; color: #e4e4e7; padding: 14px; border-radius: 8px;
  font-family: inherit; font-size: 14px; overflow-x: auto;
  border: 1px solid #3f3f46; white-space: pre-wrap; word-break: break-word;
  margin: 12px 0;
}
code { font-family: inherit; background: #27272a; padding: 2px 6px; border-radius: 4px; color: #a855f7; }
hr { border: none; border-top: 1px solid #3f3f46; margin: 20px 0; }
input[type=text] {
  padding: 12px 14px; background: #27272a; border: 1px solid #3f3f46; border-radius: 8px;
  color: #e4e4e7; font-size: 16px; font-family: inherit; width: 100%;
  min-height: 44px; -webkit-appearance: none;
}
textarea {
  padding: 12px 14px; background: #27272a; border: 1px solid #3f3f46; border-radius: 8px;
  color: #e4e4e7; font-size: 16px; font-family: inherit; width: 100%;
  min-height: 140px; resize: vertical; tab-size: 2; -webkit-appearance: none;
}
input:focus, textarea:focus { outline: none; border-color: #a855f7; box-shadow: 0 0 0 2px rgba(168,85,247,0.3); }
.btn {
  padding: 12px 24px; background: #a855f7; color: white; border: none;
  border-radius: 8px; cursor: pointer; font-size: 16px; font-family: inherit;
  font-weight: 600; min-height: 44px; -webkit-appearance: none; touch-action: manipulation;
}
.btn:hover { background: #9333ea; }
.btn:active { background: #7e22ce; transform: scale(0.98); }
.btn-outline {
  padding: 12px 24px; background: transparent; color: #a1a1aa; border: 1px solid #3f3f46;
  border-radius: 8px; cursor: pointer; font-size: 16px; font-family: inherit;
  font-weight: 600; min-height: 44px; -webkit-appearance: none; touch-action: manipulation;
}
.btn-outline:hover { border-color: #a855f7; color: #e4e4e7; }
.btn-row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
.feedback { margin: 12px 0; padding: 12px 16px; border-radius: 8px; font-weight: 600; }
.feedback.pass { background: rgba(74,222,128,0.1); color: #4ade80; border: 1px solid rgba(74,222,128,0.2); }
.feedback.fail { background: rgba(248,113,113,0.1); color: #f87171; border: 1px solid rgba(248,113,113,0.2); }
.hidden { display: none; }
.loading { text-align: center; padding: 48px; color: #a1a1aa; font-size: 16px; }
.progress-bar { height: 4px; background: #27272a; border-radius: 2px; margin: 16px 0; overflow: hidden; }
.progress-fill { height: 100%; background: #a855f7; border-radius: 2px; transition: width 0.3s; }
/* Tabs */
.tabs { display: flex; gap: 0; margin: 16px 0 0 0; border-bottom: 2px solid #27272a; }
.tab {
  padding: 10px 20px; background: transparent; color: #71717a; border: none;
  font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
  border-bottom: 2px solid transparent; margin-bottom: -2px; min-height: 44px;
  touch-action: manipulation;
}
.tab.active { color: #a855f7; border-bottom-color: #a855f7; }
.tab:hover { color: #e4e4e7; }
.tab-panel { display: none; }
.tab-panel.active { display: block; }
/* Canvas: running system visualization */
.canvas {
  background: #0f0f12; color: #e4e4e7; border-radius: 0 0 8px 8px; padding: 16px; min-height: 160px;
  font-family: inherit; border: 1px solid #3f3f46; border-top: none; display: flex; flex-direction: column; gap: 12px;
}
.canvas-empty { color: #52525b; font-style: italic; font-size: 14px; text-align: center; padding: 40px 0; }
.canvas-section-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: #52525b; margin-bottom: 2px; }
/* Actor boxes */
.actor-grid { display: flex; flex-wrap: wrap; gap: 10px; }
.actor-box {
  background: #1a1a2e; border: 1px solid #2d2d44; border-radius: 8px; padding: 10px 14px;
  min-width: 140px; flex: 1; max-width: 280px;
}
.actor-name { color: #a855f7; font-weight: 700; font-size: 13px; margin-bottom: 4px; }
.actor-state { font-size: 12px; color: #a1a1aa; }
.actor-field { display: flex; gap: 6px; margin: 2px 0; }
.actor-field-key { color: #71717a; }
.actor-field-val { color: #4ade80; }
/* Messages */
.msg-log { display: flex; flex-direction: column; gap: 3px; }
.msg-entry { font-size: 12px; color: #71717a; }
.msg-entry .msg-target { color: #a855f7; }
.msg-entry .msg-name { color: #facc15; }
.msg-entry .msg-arrow { color: #52525b; }
/* Result value */
.result-value { font-size: 14px; color: #4ade80; padding: 8px 0; }
.result-error { font-size: 14px; color: #f87171; }
.result-prints { font-size: 13px; color: #60a5fa; white-space: pre-wrap; }
/* Variables */
.var-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.var-pill { background: #1a1a2e; border: 1px solid #2d2d44; border-radius: 6px; padding: 4px 10px; font-size: 12px; }
.var-pill .var-name { color: #71717a; }
.var-pill .var-val { color: #e4e4e7; }
/* View rendering inside canvas */
.view-preview {
  background: #fafafa; color: #111; border-radius: 8px; padding: 16px; margin: 12px 0;
  font-family: system-ui, sans-serif; border: 1px solid #3f3f46;
}
.view-preview h1, .view-preview h2, .view-preview h3 { color: #111; margin: 4px 0; }
.view-preview span { color: #333; }
.view-preview button {
  padding: 8px 16px; background: #0070f3; color: white; border: none;
  border-radius: 4px; cursor: default; font-size: 14px; font-family: system-ui, sans-serif;
}
.view-preview hr { border-top: 1px solid #ddd; margin: 8px 0; }
.view-preview div { display: flex; flex-direction: column; gap: 6px; }
.view-preview div[data-row] { flex-direction: row; gap: 8px; align-items: center; }
.view-preview strong { font-weight: bold; }
.view-preview em { font-style: italic; }
.view-preview pre { background: #1e1e1e; color: #d4d4d4; padding: 12px; font-family: monospace; }
.view-preview code { background: #eee; padding: 2px 4px; border-radius: 2px; font-family: monospace; }
.view-preview ul { padding-left: 20px; }
.view-preview a { color: #0070f3; }
.view-preview img { max-width: 100%; }
@media (max-width: 480px) {
  .page { padding: 12px; padding-top: 16px; }
  h1 { font-size: 20px; }
  h2 { font-size: 16px; }
  pre { font-size: 13px; padding: 12px; }
  .btn, .btn-outline { width: 100%; }
  .btn-row { flex-direction: column; }
}
</style>
</head>
<body>

<div class="page">
  <noscript><p style="color:#f87171;padding:24px">JavaScript is required for the Blimp tutorial.</p></noscript>
  <div id="loading" class="loading">Loading Blimp interpreter (178KB)...</div>
  <div id="app" class="hidden"></div>
</div>

<script src="blimp.js"></script>
<script>
(function() {

  // ── View renderer (view_node JSON -> DOM) ──────────────
  function renderView(node) {
    if (!node) return document.createTextNode('');
    if (typeof node === 'string') return document.createTextNode(node);
    if (node.text !== undefined) return document.createTextNode(node.text);
    var tag = node.tag;
    var attrs = node.attrs || {};
    var children = node.children || [];
    var el;
    switch (tag) {
      case 'stack': el = document.createElement('div'); break;
      case 'row':
        el = document.createElement('div');
        el.setAttribute('data-row', '');
        break;
      case 'text': el = document.createElement('span'); break;
      case 'heading':
        var lvl = Math.max(1, Math.min(6, attrs.level || 1));
        el = document.createElement('h' + lvl);
        break;
      case 'bold': el = document.createElement('strong'); break;
      case 'italic': el = document.createElement('em'); break;
      case 'code': el = document.createElement('code'); break;
      case 'code_block': el = document.createElement('pre'); break;
      case 'blockquote': el = document.createElement('blockquote'); break;
      case 'divider': return document.createElement('hr');
      case 'list':
        el = document.createElement('ul');
        for (var i = 0; i < children.length; i++) {
          var li = document.createElement('li');
          li.appendChild(renderView(children[i]));
          el.appendChild(li);
        }
        return el;
      case 'link':
        el = document.createElement('a');
        if (attrs.href) el.href = attrs.href;
        break;
      case 'image':
        el = document.createElement('img');
        if (attrs.src) el.src = attrs.src;
        if (attrs.alt) el.alt = attrs.alt;
        return el;
      case 'button':
        el = document.createElement('button');
        break;
      default: el = document.createElement('div'); break;
    }
    for (var i = 0; i < children.length; i++) {
      el.appendChild(renderView(children[i]));
    }
    return el;
  }

  // ── Lessons ────────────────────────────────────────────

  var lessons = [
    // -- Chapter 1: Values --
    {
      title: "Values: Integers",
      description: "Blimp has integers and arithmetic. What does this evaluate to?",
      showCode: "2 + 3",
      type: "predict", expected: "5"
    },
    {
      title: "Values: Strings",
      description: "Strings use double quotes. <code>concat</code> joins them. What does this return?",
      showCode: 'concat("hello", " world")',
      type: "predict", expected: "hello world"
    },
    {
      title: "Values: Atoms and Booleans",
      description: "Atoms start with <code>:</code> and represent themselves. Booleans are <code>true</code> and <code>false</code>. What does this return?",
      showCode: "3 > 2",
      type: "predict", expected: "true"
    },

    // -- Chapter 2: Variables and Functions --
    {
      title: "Variables",
      description: "Variables are assigned with <code>=</code>. Fill in the blank so x equals 42:",
      starter: "x = ___",
      type: "fill",
      validate: function(code, b) {
        b.reset(); var r = b.eval(code); if (!r.ok) return {pass:false, msg:r.error};
        var c = b.eval("x"); return c.ok && c.value==="42" ? {pass:true} : {pass:false, msg:"x should be 42, got: "+(c.ok?c.value:c.error)};
      }
    },
    {
      title: "Functions",
      description: "Functions are defined with <code>def</code>. Write a function called <code>double</code> that returns n * 2:",
      starter: "def double(n) do\n  \nend",
      type: "write",
      validate: function(code, b) {
        b.reset(); var r = b.eval(code); if (!r.ok) return {pass:false, msg:r.error};
        var t = b.eval("double(5)");
        return (t.ok && t.value==="10") ? {pass:true, msg:"double(5) = 10"} : {pass:false, msg:"double(5) should be 10, got: "+(t.ok?t.value:t.error)};
      }
    },

    // -- Chapter 3: Your First View --
    {
      title: "Your First View",
      description: "Blimp has built-in view primitives. <code>text(\"hello\")</code> creates a text element. Try it -- type the code and see it render below:",
      starter: 'text("Hello, Blimp!")',
      type: "view",
      validate: function(code, b) {
        b.reset(); var r = b.eval(code);
        if (!r.ok) return {pass:false, msg:r.error};
        return r.view ? {pass:true, view:r.view} : {pass:false, msg:"That didn't produce a view. Use text(), heading(), or other view primitives."};
      }
    },
    {
      title: "Headings",
      description: "<code>heading(\"title\")</code> makes a heading. <code>heading(\"title\", 2)</code> makes an h2. Create an h2 that says \"Welcome\":",
      starter: '',
      type: "view",
      validate: function(code, b) {
        b.reset(); var r = b.eval(code);
        if (!r.ok) return {pass:false, msg:r.error};
        if (!r.view) return {pass:false, msg:"No view produced. Try heading(\"Welcome\", 2)"};
        if (r.value && r.value.indexOf && r.value.indexOf("Welcome") === -1) return {pass:false, msg:"The heading should say \"Welcome\""};
        return {pass:true, view:r.view};
      }
    },
    {
      title: "Stacking Views",
      description: "<code>stack()</code> arranges views vertically. Build a stack with a heading and some text:",
      starter: 'stack(\n  heading("My Page"),\n  text("This is Blimp.")\n)',
      type: "view",
      validate: function(code, b) {
        b.reset(); var r = b.eval(code);
        if (!r.ok) return {pass:false, msg:r.error};
        return r.view ? {pass:true, view:r.view} : {pass:false, msg:"No view. Use stack() to compose views."};
      }
    },
    {
      title: "Rows and Buttons",
      description: "<code>row()</code> lays things out horizontally. <code>button(\"label\")</code> creates a button. Make a row with two buttons:",
      starter: 'row(\n  button("Yes"),\n  button("No")\n)',
      type: "view",
      validate: function(code, b) {
        b.reset(); var r = b.eval(code);
        if (!r.ok) return {pass:false, msg:r.error};
        return r.view ? {pass:true, view:r.view} : {pass:false, msg:"No view produced."};
      }
    },
    {
      title: "Build a Card",
      description: "Combine what you know. Build a card with a heading, description text, a divider, and a row of buttons:",
      starter: '',
      type: "view",
      validate: function(code, b) {
        b.reset(); var r = b.eval(code);
        if (!r.ok) return {pass:false, msg:r.error};
        if (!r.view) return {pass:false, msg:"No view. Try stack(heading(...), text(...), divider(), row(...))"};
        // Check it has some depth
        var s = JSON.stringify(r.view);
        var hasHeading = s.indexOf('"heading"') !== -1;
        var hasButton = s.indexOf('"button"') !== -1;
        if (!hasHeading || !hasButton) return {pass:false, msg:"Include at least a heading() and a button()."};
        return {pass:true, view:r.view, msg:"Nice card!"};
      }
    },

    // -- Chapter 4: Actors --
    {
      title: "Your First Actor",
      description: "Actors hold state and respond to messages. Fill in the default name so the Greeter says \"Hello, World\":",
      starter: 'actor Greeter do\n  state name: String :: ___\n  on :greet do\n    reply concat("Hello, ", name)\n  end\nend',
      type: "write",
      validate: function(code, b) {
        b.reset(); var r = b.eval(code); if (!r.ok) return {pass:false, msg:r.error};
        var t = b.eval('Greeter <- :greet');
        return (t.ok && t.value==='Hello, World') ? {pass:true} : {pass:false, msg:'Greeter <- :greet should return "Hello, World", got: '+(t.ok?t.value:t.error)};
      }
    },
    {
      title: "Actor State: become",
      description: "<code>become</code> updates an actor's state. Write a Counter with <code>:increment</code> (adds 1) and <code>:get_count</code> (replies count):",
      starter: "actor Counter do\n  state count: Int :: 0\n\n  \nend",
      type: "write",
      validate: function(code, b) {
        b.reset(); var r = b.eval(code); if (!r.ok) return {pass:false, msg:r.error};
        var t1 = b.eval('Counter <- :get_count');
        if (!t1.ok || t1.value!=="0") return {pass:false, msg:"count should start at 0, got: "+(t1.ok?t1.value:t1.error)};
        b.eval('Counter <- :increment');
        var t2 = b.eval('Counter <- :get_count');
        if (!t2.ok || t2.value!=="1") return {pass:false, msg:"after increment, count should be 1, got: "+(t2.ok?t2.value:t2.error)};
        return {pass:true, msg:"2/2 tests passed!"};
      }
    },
    {
      title: "Actors That Render",
      description: "An actor can have an <code>on :render</code> handler that returns a view. Add a render handler to this Counter that shows the count:",
      starter: 'actor Counter do\n  state count: Int :: 0\n  on :increment do become count: count + 1 end\n  on :get_count do reply count end\n\n  on :render do\n    reply ___\n  end\nend',
      type: "view",
      validate: function(code, b) {
        b.reset(); var r = b.eval(code); if (!r.ok) return {pass:false, msg:r.error};
        var v = b.eval('Counter <- :render');
        if (!v.ok) return {pass:false, msg:v.error};
        if (!v.view) return {pass:false, msg:"The :render handler should reply with a view (stack, text, etc.)"};
        return {pass:true, view:v.view, msg:"Your actor renders a view!"};
      }
    },

    // -- Chapter 5: Lists and Higher-Order Functions --
    {
      title: "Lists and map",
      description: "<code>map</code> transforms every element. What does this return?",
      showCode: "map([1, 2, 3], fn(x: Int) do x * 2 end)",
      type: "predict", expected: "[2, 4, 6]"
    },
    {
      title: "filter",
      description: "<code>filter</code> keeps matching elements. What does this return?",
      showCode: "filter([1, 2, 3, 4, 5], fn(x: Int) do x > 3 end)",
      type: "predict", expected: "[4, 5]"
    },
    {
      title: "Pipes",
      description: "The pipe operator <code>|></code> chains calls. Underscore <code>_</code> marks where the value goes. What does this return?",
      showCode: '[1, 2, 3, 4, 5] |> filter(_, fn(x: Int) do x > 2 end) |> length',
      type: "predict", expected: "3"
    },

    // -- Chapter 6: Putting It All Together --
    {
      title: "Render a List",
      description: "Use <code>map</code> to turn data into views. Render a list of names as text elements inside a stack:",
      starter: 'names = ["Alice", "Bob", "Carol"]\n\nstack(\n  heading("People"),\n  \n)',
      type: "view",
      validate: function(code, b) {
        b.reset(); var r = b.eval(code);
        if (!r.ok) return {pass:false, msg:r.error};
        if (!r.view) return {pass:false, msg:"No view. Try using map(names, fn(n: String) do text(n) end) inside the stack."};
        var s = JSON.stringify(r.view);
        if (s.indexOf("Alice")===-1 || s.indexOf("Bob")===-1) return {pass:false, msg:"The view should show all the names."};
        return {pass:true, view:r.view, msg:"Data-driven views!"};
      }
    },
    {
      title: "Build a Profile Card",
      description: "Combine everything: a function that takes a name and role, returns a styled card view. Then call it:",
      starter: 'def profile_card(name, role) do\n  stack(\n    \n  )\nend\n\nprofile_card("Ada Lovelace", "First Programmer")',
      type: "view",
      validate: function(code, b) {
        b.reset(); var r = b.eval(code);
        if (!r.ok) return {pass:false, msg:r.error};
        if (!r.view) return {pass:false, msg:"No view. Make sure profile_card returns a stack() with the name and role."};
        var s = JSON.stringify(r.view);
        if (s.indexOf("Ada")===-1) return {pass:false, msg:"The card should show the name."};
        if (s.indexOf("Programmer")===-1) return {pass:false, msg:"The card should show the role."};
        return {pass:true, view:r.view, msg:"Beautiful."};
      }
    },
    {
      title: "A Full Page",
      description: "Build a complete page: heading, description, a list of items rendered from data, and a button. Make it yours:",
      starter: '',
      type: "view",
      validate: function(code, b) {
        b.reset(); var r = b.eval(code);
        if (!r.ok) return {pass:false, msg:r.error};
        if (!r.view) return {pass:false, msg:"No view produced. Build something with stack(), heading(), text(), and button()."};
        var s = JSON.stringify(r.view);
        var depth = (s.match(/"children"/g) || []).length;
        if (depth < 2) return {pass:false, msg:"Go bigger -- nest some views inside each other."};
        return {pass:true, view:r.view, msg:"You just built a page in Blimp."};
      }
    }
  ];

  // ── State ──────────────────────────────────────────────

  var currentLesson = 0;
  var blimpInstance = null;
  var app = document.getElementById('app');
  var loading = document.getElementById('loading');

  // Restore progress
  try { currentLesson = parseInt(localStorage.getItem('blimp_lesson') || '0') || 0; } catch(e) {}

  // ── Load WASM ──────────────────────────────────────────

  try {
    var blimp = new Blimp();
    blimp.init('blimp.wasm').then(function() {
      blimpInstance = blimp;
      loading.classList.add('hidden');
      app.classList.remove('hidden');
      try { render(); } catch(e) {
        app.innerHTML = '<p style="color:#f87171;padding:24px">Render error: ' + e.message + '</p>';
      }
    }).catch(function(e) {
      loading.textContent = 'WASM init failed: ' + e.message;
      loading.style.color = '#f87171';
    });
  } catch(e) {
    loading.textContent = 'Script error: ' + e.message;
    loading.style.color = '#f87171';
  }

  // ── Render ─────────────────────────────────────────────

  function render() {
    var lesson = lessons[currentLesson];
    var progress = (currentLesson / lessons.length) * 100;
    var html = '';

    html += '<div class="header">';
    html += '<h1>Learn Blimp</h1>';
    html += '<span class="lesson-num">' + (currentLesson + 1) + ' / ' + lessons.length + '</span>';
    html += '</div>';
    html += '<div class="progress-bar"><div class="progress-fill" style="width:' + progress + '%"></div></div>';
    html += '<h2>' + lesson.title + '</h2>';
    html += '<p class="description">' + lesson.description + '</p>';

    // Tabs: Code and Output
    html += '<div class="tabs">';
    html += '<button class="tab active" id="tab-code">Code</button>';
    html += '<button class="tab" id="tab-output">Output</button>';
    html += '</div>';

    // Code tab
    html += '<div class="tab-panel active" id="panel-code">';
    if (lesson.showCode) {
      html += '<pre>' + esc(lesson.showCode) + '</pre>';
    }
    if (lesson.type === 'predict') {
      html += '<input type="text" id="answer" placeholder="Type your answer..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />';
    } else {
      html += '<textarea id="code" placeholder="Write your code here..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">' + esc(lesson.starter || '') + '</textarea>';
    }
    html += '<div class="btn-row"><button class="btn" id="check-btn">Run</button></div>';
    html += '</div>';

    // Output tab (canvas)
    html += '<div class="tab-panel" id="panel-output">';
    html += '<div class="canvas" id="canvas"><div class="canvas-empty">Hit Run to see output</div></div>';
    html += '</div>';

    html += '<div id="feedback"></div>';

    html += '<hr>';
    html += '<div class="btn-row">';
    if (currentLesson > 0) html += '<button class="btn-outline" id="prev-btn">Previous</button>';
    html += '<div id="next-container"></div>';
    html += '</div>';

    app.innerHTML = html;

    // Wire tab switching
    var tabCode = document.getElementById('tab-code');
    var tabOutput = document.getElementById('tab-output');
    var panelCode = document.getElementById('panel-code');
    var panelOutput = document.getElementById('panel-output');

    tabCode.addEventListener('click', function() {
      tabCode.classList.add('active'); tabOutput.classList.remove('active');
      panelCode.classList.add('active'); panelOutput.classList.remove('active');
    });
    tabOutput.addEventListener('click', function() {
      tabOutput.classList.add('active'); tabCode.classList.remove('active');
      panelOutput.classList.add('active'); panelCode.classList.remove('active');
    });

    // Wire events
    document.getElementById('check-btn').addEventListener('click', handleCheck);

    var inputEl = document.getElementById('answer') || document.getElementById('code');
    if (inputEl) {
      inputEl.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey && inputEl.tagName === 'INPUT') {
          e.preventDefault(); handleCheck();
        }
        // Ctrl/Cmd+Enter for textarea
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && inputEl.tagName === 'TEXTAREA') {
          e.preventDefault(); handleCheck();
        }
      });
      // Tab inserts spaces in textarea
      if (inputEl.tagName === 'TEXTAREA') {
        inputEl.addEventListener('keydown', function(e) {
          if (e.key === 'Tab') {
            e.preventDefault();
            var s = inputEl.selectionStart;
            inputEl.value = inputEl.value.substring(0,s) + '  ' + inputEl.value.substring(inputEl.selectionEnd);
            inputEl.selectionStart = inputEl.selectionEnd = s + 2;
          }
        });
      }
      inputEl.focus();
    }

    var prevBtn = document.getElementById('prev-btn');
    if (prevBtn) prevBtn.addEventListener('click', function() { currentLesson--; saveProgress(); render(); });
  }

  function handleCheck() {
    var lesson = lessons[currentLesson];
    var feedbackEl = document.getElementById('feedback');
    var canvas = document.getElementById('canvas');
    var result;
    var prints = [];

    // Capture prints from the WASM module
    blimpInstance.onPrint(function(s) { prints.push(s); });

    if (lesson.type === 'predict') {
      // For predict: eval the shown code to populate the canvas, then check the answer
      blimpInstance.reset();
      var evalResult = blimpInstance.eval(lesson.showCode);
      populateCanvas(canvas, evalResult, prints);
      var answer = document.getElementById('answer').value.trim();
      result = (answer === lesson.expected) ? {pass:true} : {pass:false, msg:'Expected: ' + lesson.expected};
    } else {
      // For write/fill/view: eval the user's code, show output in canvas, then validate
      var code = document.getElementById('code').value;
      blimpInstance.reset();
      var evalResult = blimpInstance.eval(code);
      populateCanvas(canvas, evalResult, prints);
      if (lesson.validate) {
        result = lesson.validate(code, blimpInstance);
        // If validate returned a view, re-render the canvas with it
        if (result.view) populateCanvas(canvas, {ok:true, view:result.view, value:''}, []);
      } else {
        result = {pass:false, msg:'No validator'};
      }
    }

    blimpInstance.onPrint(null);

    // Switch to Output tab
    var tabCode = document.getElementById('tab-code');
    var tabOutput = document.getElementById('tab-output');
    var panelCode = document.getElementById('panel-code');
    var panelOutput = document.getElementById('panel-output');
    tabOutput.classList.add('active'); tabCode.classList.remove('active');
    panelOutput.classList.add('active'); panelCode.classList.remove('active');

    feedbackEl.className = 'feedback ' + (result.pass ? 'pass' : 'fail');
    feedbackEl.textContent = result.pass ? (result.msg || 'Correct!') : (result.msg || 'Not quite.');

    if (result.pass) {
      var container = document.getElementById('next-container');
      if (currentLesson < lessons.length - 1) {
        container.innerHTML = '<button class="btn" id="next-btn">Next Lesson &rarr;</button>';
        document.getElementById('next-btn').addEventListener('click', function() {
          currentLesson++; saveProgress(); render();
        });
      } else {
        container.innerHTML = '<span style="color:#4ade80;font-weight:600">You completed all lessons!</span>';
      }
    }
  }

  function populateCanvas(canvas, evalResult, prints) {
    canvas.innerHTML = '';

    // Get full system state from WASM
    var state = blimpInstance.getState();

    // 1. Errors
    if (!evalResult.ok) {
      var errEl = document.createElement('div');
      errEl.className = 'result-error';
      errEl.textContent = evalResult.error;
      canvas.appendChild(errEl);
      return;
    }

    // 2. Print output
    if (prints.length > 0) {
      var printEl = document.createElement('div');
      printEl.className = 'result-prints';
      printEl.textContent = prints.join('\n');
      canvas.appendChild(printEl);
    }

    // 3. Actors -- the running system
    if (state.actors && state.actors.length > 0) {
      var label = document.createElement('div');
      label.className = 'canvas-section-label';
      label.textContent = 'Actors';
      canvas.appendChild(label);

      var grid = document.createElement('div');
      grid.className = 'actor-grid';
      for (var i = 0; i < state.actors.length; i++) {
        var actor = state.actors[i];
        var box = document.createElement('div');
        box.className = 'actor-box';

        var name = document.createElement('div');
        name.className = 'actor-name';
        name.textContent = actor.type;
        box.appendChild(name);

        var stateDiv = document.createElement('div');
        stateDiv.className = 'actor-state';
        var keys = Object.keys(actor.state || {});
        for (var k = 0; k < keys.length; k++) {
          var field = document.createElement('div');
          field.className = 'actor-field';
          field.innerHTML = '<span class="actor-field-key">' + esc(keys[k]) + ':</span> <span class="actor-field-val">' + esc(String(actor.state[keys[k]])) + '</span>';
          stateDiv.appendChild(field);
        }
        box.appendChild(stateDiv);
        grid.appendChild(box);
      }
      canvas.appendChild(grid);
    }

    // 4. Messages sent
    if (state.messages && state.messages.length > 0) {
      var mlabel = document.createElement('div');
      mlabel.className = 'canvas-section-label';
      mlabel.textContent = 'Messages';
      canvas.appendChild(mlabel);

      var msgLog = document.createElement('div');
      msgLog.className = 'msg-log';
      for (var m = 0; m < state.messages.length; m++) {
        var msg = state.messages[m];
        var entry = document.createElement('div');
        entry.className = 'msg-entry';
        entry.innerHTML = '<span class="msg-arrow">\u2192</span> <span class="msg-target">' + esc(msg.target) + '</span> <span class="msg-arrow">\u2190</span> <span class="msg-name">:' + esc(msg.message) + '</span>';
        msgLog.appendChild(entry);
      }
      canvas.appendChild(msgLog);
    }

    // 5. View output
    if (evalResult.view) {
      var vlabel = document.createElement('div');
      vlabel.className = 'canvas-section-label';
      vlabel.textContent = 'Rendered View';
      canvas.appendChild(vlabel);

      var preview = document.createElement('div');
      preview.className = 'view-preview';
      preview.appendChild(renderView(evalResult.view));
      canvas.appendChild(preview);
    }

    // 6. Return value (if not a view and not nil)
    if (evalResult.value && evalResult.value !== 'nil' && !evalResult.view) {
      var rlabel = document.createElement('div');
      rlabel.className = 'canvas-section-label';
      rlabel.textContent = 'Result';
      canvas.appendChild(rlabel);

      var valEl = document.createElement('div');
      valEl.className = 'result-value';
      valEl.textContent = evalResult.value;
      canvas.appendChild(valEl);
    }

    // 7. Variables (filter out actor refs and internal stuff)
    if (state.vars && state.vars.length > 0) {
      var userVars = state.vars.filter(function(v) {
        return v.value && v.value.indexOf('ref<') === -1 && v.value.indexOf('fn(') === -1;
      });
      if (userVars.length > 0) {
        var varlabel = document.createElement('div');
        varlabel.className = 'canvas-section-label';
        varlabel.textContent = 'Variables';
        canvas.appendChild(varlabel);

        var varGrid = document.createElement('div');
        varGrid.className = 'var-grid';
        for (var vi = 0; vi < userVars.length; vi++) {
          var pill = document.createElement('span');
          pill.className = 'var-pill';
          pill.innerHTML = '<span class="var-name">' + esc(userVars[vi].name) + '</span> = <span class="var-val">' + esc(userVars[vi].value) + '</span>';
          varGrid.appendChild(pill);
        }
        canvas.appendChild(varGrid);
      }
    }

    // If canvas still empty
    if (canvas.children.length === 0) {
      var empty = document.createElement('div');
      empty.className = 'canvas-empty';
      empty.textContent = 'No output';
      canvas.appendChild(empty);
    }
  }

  function saveProgress() {
    try { localStorage.setItem('blimp_lesson', currentLesson.toString()); } catch(e) {}
  }

  function esc(s) {
    if (!s) return '';
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

})();
</script>
</body>
</html>
