<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blimp REPL</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #1a1a2e;
  color: #d4d4d4;
  font-family: 'IBM Plex Mono', 'Fira Code', 'JetBrains Mono', 'Cascadia Code', 'SF Mono', Consolas, monospace;
  font-size: 14px;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

.header {
  padding: 0.75rem 1.5rem;
  border-bottom: 1px solid #2a2a3e;
  display: flex;
  align-items: center;
  gap: 1rem;
  flex-shrink: 0;
}

.header h1 { font-size: 1rem; font-weight: 500; color: #a6e22e; }
.header .status { font-size: 0.8rem; color: #666; }

.main {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* Left column: REPL on top, canvas on bottom */
.left-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* The entire REPL scrolls as one stream */
.repl-pane {
  flex: 1;
  overflow-y: auto;
  padding: 1rem 1.5rem;
  font-size: 13px;
  line-height: 1.6;
  min-height: 0;
}

.view-pane {
  height: 45%;
  border-top: 1px solid #2a2a3e;
  flex-shrink: 0;
  overflow-y: auto;
  padding: 1rem 1.5rem;
}

.view-pane:empty {
  display: none;
}

/* View DSL rendering */
.blimp-stack { display: flex; flex-direction: column; gap: 0.5rem; }
.blimp-row { display: flex; flex-direction: row; gap: 0.5rem; align-items: center; }
.blimp-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 0.5rem; }
.blimp-text { color: #d4d4d4; }
.blimp-bold { font-weight: bold; }
.blimp-italic { font-style: italic; }
.blimp-code { font-family: inherit; background: #2a2a3e; padding: 0.1em 0.4em; border-radius: 3px; color: #a6e22e; }
.blimp-code-block { background: #2a2a3e; padding: 0.75rem 1rem; border-radius: 4px; color: #a6e22e; white-space: pre-wrap; font-family: inherit; overflow-x: auto; }
.blimp-blockquote { border-left: 3px solid #a6e22e; padding-left: 1rem; color: #999; font-style: italic; }
.blimp-divider { border: none; border-top: 1px solid #2a2a3e; margin: 0.5rem 0; }
.blimp-list { list-style: disc; padding-left: 1.5rem; color: #d4d4d4; }
.blimp-list li { margin-bottom: 0.25rem; }
.blimp-link { color: #6cb6ff; text-decoration: underline; cursor: pointer; }
.blimp-image { max-width: 100%; border-radius: 4px; }
.blimp-video { max-width: 100%; border-radius: 4px; }
.blimp-canvas { border: 1px solid #2a2a3e; border-radius: 4px; }
.blimp-button {
  background: #2a2a3e;
  color: #a6e22e;
  border: 1px solid #3a3a5e;
  padding: 0.4rem 1rem;
  border-radius: 4px;
  cursor: pointer;
  font: inherit;
  font-size: 13px;
  transition: background 0.15s;
}
.blimp-button:hover { background: #3a3a5e; }
.blimp-button:active { background: #4a4a6e; }

.repl-pane .line {
  white-space: pre-wrap;
  word-break: break-all;
}

.prompt-line { color: #a6e22e; }
.result-line { color: #d4d4d4; }
.error-line { color: #f92672; }
.print-line { color: #6cb6ff; }
.spacer-line { height: 0.4em; }

/* Inline input row: prompt + textarea on the same line */
.input-row {
  display: flex;
  align-items: flex-start;
  gap: 0;
  margin-top: 0.15rem;
}

.input-row .prompt-char {
  color: #a6e22e;
  user-select: none;
  white-space: pre;
}

.input-row textarea {
  flex: 1;
  background: transparent;
  border: none;
  color: #d4d4d4;
  font: inherit;
  font-size: 13px;
  line-height: 1.6;
  resize: none;
  outline: none;
  min-height: 1.6em;
  max-height: 20em;
  padding: 0;
  margin: 0;
}

.state-pane {
  width: 280px;
  border-left: 1px solid #2a2a3e;
  padding: 1rem;
  overflow-y: auto;
  flex-shrink: 0;
}

.state-pane h2 {
  font-size: 0.8rem;
  color: #666;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 0.75rem;
}

.state-pane .var { margin-bottom: 0.3rem; font-size: 12px; }
.state-pane .var-name { color: #a6e22e; }
.state-pane .var-eq { color: #666; }
.state-pane .var-val { color: #d4d4d4; }

@media (max-width: 700px) {
  .state-pane { display: none; }
}
</style>
</head>
<body>

<div class="header">
  <h1>blimp</h1>
  <span class="status" id="status">loading...</span>
</div>

<div class="main">
  <div class="left-col">
    <div class="repl-pane" id="repl">
      <!-- lines and input get appended here -->
    </div>
    <div class="view-pane" id="view-pane"></div>
  </div>
  <div class="state-pane">
    <h2>State</h2>
    <div id="state-content"></div>
  </div>
</div>

<script src="blimp.js"></script>
<script>
(async function() {
  var repl = document.getElementById('repl');
  var statusEl = document.getElementById('status');
  var stateContent = document.getElementById('state-content');
  var viewPane = document.getElementById('view-pane');

  var blimp = new Blimp();
  var history = [];
  var historyIdx = -1;
  var buffer = '';
  var depth = 0;
  var inputRow = null;
  var inputEl = null;

  // Track mounted actors for re-rendering
  var mountedActors = {}; // { refString: { ref, viewData } }

  blimp.onPrint(function(str) {
    addLine('print-line', str);
  });

  try {
    await blimp.init('blimp.wasm');
    statusEl.textContent = 'ready';
    statusEl.style.color = '#a6e22e';
    addLine('result-line', 'Blimp REPL ready. Shift+Enter for newlines.');
    addLine('spacer-line', '');
  } catch (e) {
    statusEl.textContent = 'failed to load';
    statusEl.style.color = '#f92672';
    addLine('error-line', 'Failed to load WASM module: ' + e.message);
    return;
  }

  createPrompt();

  repl.addEventListener('click', function() {
    if (inputEl) inputEl.focus();
  });

  // ── View renderer ─────────────────────────────────────
  // Maps view_node JSON tree -> DOM elements

  function renderView(node) {
    if (!node) return document.createTextNode('');

    // Text leaf node
    if (node.text !== undefined) {
      return document.createTextNode(node.text);
    }

    var tag = node.tag;
    var attrs = node.attrs || {};
    var children = node.children || [];
    var el;

    switch (tag) {
      case 'stack':
        el = document.createElement('div');
        el.className = 'blimp-stack';
        break;
      case 'row':
        el = document.createElement('div');
        el.className = 'blimp-row';
        break;
      case 'grid':
        el = document.createElement('div');
        el.className = 'blimp-grid';
        break;
      case 'text':
        el = document.createElement('span');
        el.className = 'blimp-text';
        break;
      case 'heading':
        var level = (attrs.level && typeof attrs.level === 'number') ? attrs.level : 1;
        level = Math.max(1, Math.min(6, level));
        el = document.createElement('h' + level);
        break;
      case 'bold':
        el = document.createElement('strong');
        el.className = 'blimp-bold';
        break;
      case 'italic':
        el = document.createElement('em');
        el.className = 'blimp-italic';
        break;
      case 'code':
        el = document.createElement('code');
        el.className = 'blimp-code';
        break;
      case 'code_block':
        el = document.createElement('pre');
        el.className = 'blimp-code-block';
        if (attrs.lang) el.dataset.lang = attrs.lang;
        break;
      case 'blockquote':
        el = document.createElement('blockquote');
        el.className = 'blimp-blockquote';
        break;
      case 'divider':
        el = document.createElement('hr');
        el.className = 'blimp-divider';
        return el; // no children
      case 'list':
        el = document.createElement('ul');
        el.className = 'blimp-list';
        // Wrap each child in an <li>
        for (var i = 0; i < children.length; i++) {
          var li = document.createElement('li');
          li.appendChild(renderView(children[i]));
          el.appendChild(li);
        }
        return el;
      case 'link':
        el = document.createElement('a');
        el.className = 'blimp-link';
        if (attrs.href) el.href = attrs.href;
        el.target = '_blank';
        el.rel = 'noopener';
        break;
      case 'image':
        el = document.createElement('img');
        el.className = 'blimp-image';
        if (attrs.src) el.src = attrs.src;
        if (attrs.alt) el.alt = attrs.alt;
        return el; // no children
      case 'video':
        el = document.createElement('video');
        el.className = 'blimp-video';
        if (attrs.src) el.src = attrs.src;
        el.controls = true;
        return el;
      case 'canvas':
        el = document.createElement('canvas');
        el.className = 'blimp-canvas';
        if (attrs.id) el.id = attrs.id;
        return el;
      case 'button':
        el = document.createElement('button');
        el.className = 'blimp-button';
        if (attrs.sends) {
          (function(msg) {
            el.addEventListener('click', function() {
              sendToActor(msg);
            });
          })(attrs.sends);
        }
        break;
      default:
        el = document.createElement('div');
        break;
    }

    // Append children
    for (var i = 0; i < children.length; i++) {
      el.appendChild(renderView(children[i]));
    }

    return el;
  }

  // Send a message to a mounted actor and re-render
  function sendToActor(message) {
    // Find which actor is mounted -- for now use the first one
    var refs = Object.keys(mountedActors);
    if (refs.length === 0) return;

    var actorRef = refs[0]; // e.g. "ref<Counter:0>"

    // Find which variable holds this actor ref
    var state = blimp.getState();
    var varName = null;
    if (state.vars) {
      for (var v of state.vars) {
        if (v.value === actorRef) { varName = v.name; break; }
      }
    }

    if (varName) {
      blimp.eval(varName + ' <- :' + message);
      var viewResult = blimp.eval(varName + ' <- :view');
      if (viewResult.ok && viewResult.view) {
        mountedActors[actorRef] = { view: viewResult.view };
        renderMountedViews();
      }
      // Update state sidebar
      updateState(blimp.getState());
      addLine('print-line', '  :' + message + ' -> ' + actorRef);
    }
  }

  function renderMountedViews() {
    viewPane.innerHTML = '';
    for (var ref in mountedActors) {
      var data = mountedActors[ref];
      if (data.view) {
        viewPane.appendChild(renderView(data.view));
      }
    }
  }

  // ── REPL functions ────────────────────────────────────

  function createPrompt() {
    inputRow = document.createElement('div');
    inputRow.className = 'input-row';

    var prompt = document.createElement('span');
    prompt.className = 'prompt-char';
    prompt.textContent = depth > 0 ? '   ... ' : 'blimp> ';

    inputEl = document.createElement('textarea');
    inputEl.rows = 1;
    inputEl.spellcheck = false;
    inputEl.autocomplete = 'off';

    inputEl.addEventListener('keydown', handleKey);
    inputEl.addEventListener('input', autoResize);

    inputRow.appendChild(prompt);
    inputRow.appendChild(inputEl);
    repl.appendChild(inputRow);

    inputEl.focus();
    repl.scrollTop = repl.scrollHeight;
  }

  function freezeInput() {
    if (!inputRow || !inputEl) return;
    var text = inputEl.value;
    var prompt = depth > 0 ? '   ... ' : 'blimp> ';
    inputRow.remove();
    addLine('prompt-line', prompt + text);
    inputRow = null;
    inputEl = null;
    return text;
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      var line = freezeInput();
      buffer += (buffer ? '\n' : '') + line;
      depth += countDepth(line);

      if (depth > 0) {
        createPrompt();
        return;
      }

      submitBuffer();
      createPrompt();
      return;
    }

    if (e.key === 'ArrowUp' && !buffer && inputEl.selectionStart === 0) {
      e.preventDefault();
      if (historyIdx > 0) {
        historyIdx--;
        inputEl.value = history[historyIdx];
        autoResize.call(inputEl);
      }
    }
    if (e.key === 'ArrowDown' && !buffer && inputEl.selectionStart === inputEl.value.length) {
      e.preventDefault();
      if (historyIdx < history.length - 1) {
        historyIdx++;
        inputEl.value = history[historyIdx];
      } else {
        historyIdx = history.length;
        inputEl.value = '';
      }
      autoResize.call(inputEl);
    }
  }

  function autoResize() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 320) + 'px';
  }

  function countDepth(text) {
    var d = 0;
    var words = text.replace(/#.*/g, '').match(/\b(do|end)\b/g) || [];
    for (var w of words) {
      if (w === 'do') d++;
      else if (w === 'end') d--;
    }
    return d;
  }

  function submitBuffer() {
    var source = buffer.trim();
    if (!source) { buffer = ''; depth = 0; return; }

    history.push(source);
    historyIdx = history.length;

    var result = blimp.eval(source);
    if (result.ok) {
      if (result.view) {
        // Result is a view -- render it in the view pane
        addLine('result-line', '=> <view>');
        // Track mounted actor views
        var state = blimp.getState();
        if (state.actors && state.actors.length) {
          // Associate view with the most recent actor
          var lastActor = state.actors[state.actors.length - 1];
          mountedActors[lastActor.ref] = { view: result.view };
        } else {
          // No actor -- just render as a one-shot view
          mountedActors['__repl__'] = { view: result.view };
        }
        renderMountedViews();
      } else if (result.value) {
        addLine('result-line', '=> ' + result.value);
      }
    } else {
      addLine('error-line', result.error);
    }

    addLine('spacer-line', '');
    var state = blimp.getState();
    updateState(state);

    buffer = '';
    depth = 0;
  }

  function updateState(state) {
    stateContent.innerHTML = '';

    if (state.vars && state.vars.length) {
      for (var v of state.vars) {
        var div = document.createElement('div');
        div.className = 'var';
        div.innerHTML = '<span class="var-name">' + esc(v.name) + '</span>' +
          ' <span class="var-eq">=</span> ' +
          '<span class="var-val">' + esc(v.value) + '</span>';
        stateContent.appendChild(div);
      }
    }

    if (state.actors && state.actors.length) {
      var heading = document.createElement('h2');
      heading.textContent = 'Actors';
      heading.style.marginTop = '1rem';
      stateContent.appendChild(heading);

      for (var a of state.actors) {
        var refDiv = document.createElement('div');
        refDiv.className = 'var';
        refDiv.innerHTML = '<span class="var-name">' + esc(a.ref) + '</span>';
        stateContent.appendChild(refDiv);

        for (var key in a.state) {
          var fieldDiv = document.createElement('div');
          fieldDiv.className = 'var';
          fieldDiv.style.paddingLeft = '1rem';
          fieldDiv.innerHTML = '<span class="var-eq">' + esc(key) + ':</span> ' +
            '<span class="var-val">' + esc(a.state[key]) + '</span>';
          stateContent.appendChild(fieldDiv);
        }
      }
    }
  }

  function esc(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function addLine(cls, text) {
    var div = document.createElement('div');
    div.className = 'line ' + cls;
    if (cls === 'spacer-line') { div.innerHTML = '&nbsp;'; }
    else { div.textContent = text; }
    repl.appendChild(div);
    repl.scrollTop = repl.scrollHeight;
  }
})();
</script>
</body>
</html>
