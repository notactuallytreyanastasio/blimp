<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>term_diff</title>
  <style>
    body {
      background: #1a1a2e;
      color: #e0e0e0;
      font-family: 'Berkeley Mono', 'SF Mono', 'JetBrains Mono', monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .loading {
      text-align: center;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #333;
      border-top-color: #4ade80;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loading">
    <div class="spinner"></div>
    <div>starting phoenix...</div>
  </div>
</body>
</html>
